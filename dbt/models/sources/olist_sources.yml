version: 2

sources:
  - name: raw_olist
    description: "Raw Olist Brazilian E-Commerce dataset from official repository"
    meta:
      external_location: "../data/olist/{name}.parquet"
    tables:
      - name: olist_customers
      - name: olist_geolocation
      - name: olist_order_items
      - name: olist_order_payments
      - name: olist_order_reviews
      - name: olist_orders
      - name: olist_products
      - name: olist_sellers
      - name: product_category_name_translation
